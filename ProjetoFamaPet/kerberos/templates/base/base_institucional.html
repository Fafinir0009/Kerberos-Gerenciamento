{#- Layout das páginas institucionais: trilha de navegação + texto. -#}
{% extends "base/base_site.html" %}

{% block conteudo %}
    <header class="faixa-politica">
        <div class="container">
            <nav class="trilha" aria-label="Trilha de navegação">
                <a href="{{ url 'index' }}" title="Início"><img src="{% static 'img/logo.svg' %}" alt="Início — FamaPet"></a>
                <span aria-hidden="true">/</span>
                <span>{
                    % block titulo_trilha %}
                    
                    {% endblock %}
                </span>
            </nav>
        </div>
    </header>

    <main class="container conteudo-politica">
        {% block conteudo_politica %}
        
        {% endblock %}
    </main>
{% endblock %}
