{% extends "base_painel.html" %}

{% block titulo %}Editar perfil — FamaPet{% endblock %}
{% block data_pagina %}perfil{% endblock %}

{% block painel %}
            <h1 class="titulo-painel mb-4">Editar perfil:</h1>

            <form id="formPerfil" style="max-width:860px" novalidate>

                <div class="grupo-perfil">
                    <div class="mb-3 campo-editavel">
                        <label class="form-label" for="perfilNome">Nome:</label>
                        <input type="text" class="campo-conta" id="perfilNome" name="nome" autocomplete="name" required>
                        <i class="bi bi-pencil-square" aria-hidden="true"></i>
                        <span class="msg-erro"></span>
                    </div>
                    <div class="mb-3 campo-editavel">
                        <label class="form-label" for="perfilEmail">Email:</label>
                        <input type="email" class="campo-conta" id="perfilEmail" name="email" autocomplete="email" required>
                        <i class="bi bi-pencil-square" aria-hidden="true"></i>
                        <span class="msg-erro"></span>
                    </div>
                    <div class="mb-3 campo-editavel">
                        <label class="form-label" for="perfilTelefone">Telefone:</label>
                        <input type="tel" class="campo-conta" id="perfilTelefone" name="telefone"
                            data-mascara="telefone" inputmode="numeric" autocomplete="tel" required>
                        <i class="bi bi-pencil-square" aria-hidden="true"></i>
                        <span class="msg-erro"></span>
                    </div>
                </div>

                <div class="grupo-perfil">
                    <div class="row">
                        <div class="col-6 col-md-4 mb-3 campo-editavel">
                            <label class="form-label" for="perfilCep">CEP</label>
                            <input type="text" class="campo-conta" id="perfilCep" name="cep"
                                data-mascara="cep" inputmode="numeric" autocomplete="postal-code">
                            <i class="bi bi-pencil-square" aria-hidden="true"></i>
                        </div>
                        <div class="col-6 col-md-3 offset-md-3 mb-3 campo-editavel">
                            <label class="form-label" for="perfilNumero">Número</label>
                            <input type="text" class="campo-conta" id="perfilNumero" name="numero" inputmode="numeric">
                            <i class="bi bi-pencil-square" aria-hidden="true"></i>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3 campo-editavel">
                            <label class="form-label" for="perfilRua">Rua</label>
                            <input type="text" class="campo-conta" id="perfilRua" name="rua" autocomplete="address-line1">
                            <i class="bi bi-pencil-square" aria-hidden="true"></i>
                        </div>
                        <div class="col-md-6 mb-3 campo-editavel">
                            <label class="form-label" for="perfilBairro">Bairro</label>
                            <input type="text" class="campo-conta" id="perfilBairro" name="bairro">
                            <i class="bi bi-pencil-square" aria-hidden="true"></i>
                        </div>
                    </div>
                </div>

                <div class="grupo-perfil">
                    <p class="titulo-grupo mb-1">Alterar senha <span class="fw-normal text-muted">(opcional)</span></p>
                    <div class="mb-3 grupo-senha" style="max-width:420px">
                        <input type="password" class="campo-conta" id="perfilNovaSenha" name="novaSenha"
                            placeholder="Nova senha (8+ caracteres)" autocomplete="new-password">
                        <button type="button" class="ver-senha" aria-label="Mostrar senha"><i class="bi bi-eye"></i></button>
                        <span class="msg-erro"></span>
                    </div>
                </div>

                <div class="d-flex justify-content-center gap-3 mt-4">
                    <button type="button" id="perfilVoltar" class="btn-cta" style="min-width:130px">Voltar</button>
                    <button type="submit" class="btn-cta" style="min-width:130px">Salvar</button>
                </div>
            </form>
{% endblock %}
