{% extends "base_painel.html" %}

{% block titulo %}Clientes — FamaPet{% endblock %}
{% block data_pagina %}clientes{% endblock %}

{% block painel %}
            <div class="quadro-painel">
                <h1 class="titulo-painel">Clientes</h1>
                <p class="subtitulo-painel">Todos os tutores cadastrados na FamaPet.</p>

                <div class="barra-tabela">
                    <div class="busca-tabela">
                        <i class="bi bi-search"></i>
                        <input type="search" id="buscaClientes" placeholder="Pesquisar por nome, e-mail ou telefone" aria-label="Pesquisar clientes">
                    </div>
                </div>

                <div class="tabela-rolagem">
                    <table class="tabela-fama">
                        <thead>
                            <tr>
                                <th scope="col">Nome</th>
                                <th scope="col">E-mail</th>
                                <th scope="col">Telefone</th>
                                <th scope="col">Pets</th>
                                <th scope="col">Agendamentos</th>
                            </tr>
                        </thead>
                        <tbody id="corpoClientes"></tbody>
                    </table>
                </div>

                <nav class="paginacao-fama" id="paginacaoClientes" aria-label="Paginação"></nav>
            </div>
{% endblock %}
