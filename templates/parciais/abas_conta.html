{#- Abas "Entrar / Cadastrar" das telas de conta.
    Variáveis:
      aba_ativa      -> 'entrar' ou 'cadastrar'
      link_cadastrar -> destino da aba Cadastrar (padrão: página de cadastro) -#}
{%- set link_cadastrar = link_cadastrar | default(url_for('cadastro')) -%}
<a class="aba-conta{% if aba_ativa == 'entrar' %} ativa{% endif %}" href="{{ url_for('login') }}"{% if aba_ativa == 'entrar' %} aria-current="page"{% endif %}>Entrar</a>
<a class="marca d-none d-sm-inline-flex" href="{{ url_for('index') }}" title="Voltar ao início">
    <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="Início — FamaPet">
</a>
<a class="aba-conta{% if aba_ativa == 'cadastrar' %} ativa{% endif %}" href="{{ link_cadastrar }}"{% if aba_ativa == 'cadastrar' %} aria-current="page"{% endif %}>Cadastrar</a>
